# Round-robin load balancer in front of the two independent web processes.
# Both processes mount the same Docker volume, so they share one SQLite
# database file (WAL mode) and therefore one per-account guessing budget.
worker_processes 1;
events {
    worker_connections 256;
}
http {
    access_log /dev/stdout;
    error_log  /dev/stderr warn;

    upstream login_backends {
        # Default: round-robin. Keep-alive to backends so disconnect behavior
        # is easy to reason about during demos.
        server web1:8000;
        server web2:8000;
        keepalive 32;
    }

    server {
        listen 8080;
        server_name _;

        location / {
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            # Do not buffer responses and do not impose a short timeout:
            # delayed verifications (up to 10s) and disconnect demonstrations
            # must reach the backend untouched.
            proxy_buffering off;
            proxy_read_timeout 120s;
            proxy_send_timeout 120s;
            proxy_pass http://login_backends;
        }
    }
}
